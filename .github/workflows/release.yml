name: Release installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create a draft prerelease after all builds pass (owner approval required)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Builds run independently of the separate Quality workflow. The dependency
# audit remains a mandatory release gate (it is intentionally red while the
# documented advisories are unresolved); publication is gated behind the
# explicit publish input below. Do not treat a successful build as approval.
jobs:
  build:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows-x64
            bundles: nsis
          - runner: windows-11-arm
            platform: windows-arm64
            bundles: nsis
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            bundles: deb,appimage,rpm
          - runner: ubuntu-22.04
            platform: linux-x64
            bundles: deb,appimage,rpm
          - runner: macos-15
            platform: macos-arm64
            bundles: dmg
          - runner: macos-15-intel
            platform: macos-x64
            bundles: dmg
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '10.15.0'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            tools/vnc-helper -> target
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y openssh-server xauth libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node tools/release-assets.mjs check-version
      - name: Check release asset validation
        run: node --test tools/release-assets.test.mjs
      - name: Frontend checks
        working-directory: apps/desktop
        run: pnpm check && pnpm lint && pnpm test:unit
      - name: Rust tests before packaging
        run: cargo test --workspace --locked --lib
      - name: Generate native bundle icons
        working-directory: apps/desktop
        run: pnpm tauri icon src-tauri/icons/icon.png
      - name: Build installers
        working-directory: apps/desktop
        run: pnpm tauri build --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json -- --locked
      - name: Check binary startup
        shell: bash
        run: |
          binary=target/release/mobarust
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          "$binary" --version
      - name: Collect installers and checksums
        run: node tools/release-assets.mjs collect ${{ matrix.platform }}
      - uses: actions/upload-artifact@v6
        with:
          name: installers-${{ matrix.platform }}
          path: target/release-assets/*
          if-no-files-found: error

  publish:
    # Never publish on a tag push. A draft release is created only when an
    # owner explicitly dispatches on the tag with publish=true.
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          pattern: installers-*
          path: release-assets
          merge-multiple: true
      - name: Verify every downloaded checksum manifest
        run: |
          cd release-assets
          for manifest in SHA256SUMS-*.txt; do sha256sum --check "$manifest"; done
      - name: Publish preview with installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --draft --prerelease --title "MobaRust $GITHUB_REF_NAME — Desktop Preview" --notes-file docs/release/preview-notes.md
